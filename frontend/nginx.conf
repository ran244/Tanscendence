server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_http_version 1.0;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_vary on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri $uri/ /index.html;
    # SPA routes such as / and /login also serve index.html through this
    # fallback. Never cache that HTML, otherwise it can keep referencing an
    # obsolete hashed JavaScript bundle after a deployment.
    add_header Cache-Control "no-cache";
  }
}
